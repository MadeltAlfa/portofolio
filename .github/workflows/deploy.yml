name: Deploy Web to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Source Code
        run: |
          echo "🚀 Sinkronisasi source code ke webproject..."
          # Salin folder web dengan aman
          [ -d "./src_web1" ] && rsync -av --delete ./src_web1/ /home/nund/webproject/src_web1/ || true
          [ -d "./src_web2" ] && rsync -av --delete ./src_web2/ /home/nund/webproject/src_web2/ || true

      - name: Reload Nginx (Optional)
        run: |
          echo "🔄 Memeriksa dan me-reload Nginx jika ada..."
          CONTAINER_ID=$(docker ps -q --filter ancestor=nginx:alpine | head -n 1)
          if [ -n "$CONTAINER_ID" ]; then
            docker exec "$CONTAINER_ID" nginx -s reload || true
          fi

      - name: Deployment Finished
        run: echo "✅ Deploy berhasil diselesaikan!"
